  - name: item_type_id
    description: Item type ID (see stg_odata__item_type) | מזהה סוג הפריט
  - name: item_name
    description: Item title (Hebrew) | כותרת הפריט
  - name: ordinal
    description: Order within the parent | מספר סידורי
  - name: status_id
    description: Status ID (see stg_odata__status) | מזהה סטטוס
  - name: updated_at
    description: When the source row last changed (LastUpdatedDate) | מועד העדכון האחרון של השורה במקור
- name: stg_odata__plenum_session
  description: 'Plenum sessions. Grain: one row per plenum session | ישיבות מליאה'
