version: 2
models:
- name: stg_odata__person
  description: 'People: MKs, ministers and other office holders. Grain: one row per person | אנשים: חברי כנסת, שרים ונושאי תפקידים'
  columns:
  - name: person_id
    description: Person ID | מזהה אדם
    data_tests:
    - unique
    - not_null
  - name: first_name
    description: First name (Hebrew) | שם פרטי
  - name: last_name
    description: Last name (Hebrew) | שם משפחה
  - name: full_name
    description: First and last name | שם מלא
  - name: gender
    description: 'Gender: female / male | מגדר'
    data_tests:
    - not_null
  - name: gender_he
    description: Gender in Hebrew | מגדר בעברית
  - name: email
    description: Knesset email address | כתובת דוא"ל בכנסת
  - name: is_current
    description: True if serving in the current Knesset | האם מכהן בכנסת הנוכחית
  - name: updated_at
    description: When the source row last changed (LastUpdatedDate) | מועד העדכון האחרון של השורה במקור
- name: stg_odata__position
  description: 'Position types (MK, minister, committee chair...). Grain: one row per position type | סוגי תפקידים (ח"כ, שר, יו"ר ועדה...)'
  columns:
  - name: position_id
    description: Position ID | מזהה תפקיד
    data_tests:
    - unique
    - not_null
  - name: position_name
    description: Position name (Hebrew) | שם התפקיד
  - name: gender_id
    description: Gender the title form applies to | המגדר שאליו מתייחס נוסח התפקיד
  - name: updated_at
    description: When the source row last changed (LastUpdatedDate) | מועד העדכון האחרון של השורה במקור
- name: stg_odata__person_position
  description: 'Who held which position, when: MK in a faction, minister, committee member. Grain: one row per person, position and period | מי כיהן באיזה תפקיד ומתי: ח"כ בסיעה, שר, חבר ועדה'
  columns:
  - name: person_position_id
    description: Person-position row ID | מזהה שורת תפקיד
    data_tests:
    - unique
    - not_null
  - name: person_id
    description: Person ID (see stg_odata__person) | מזהה אדם
  - name: position_id
    description: Position ID (see stg_odata__position) | מזהה תפקיד
  - name: knesset_num
    description: Knesset number (e.g. 25) | מספר הכנסת (למשל 25)
  - name: faction_id
    description: Faction the person belonged to in this period | הסיעה שאליה השתייך בתקופה זו
  - name: faction_name
    description: Faction name (Hebrew) | שם הסיעה
  - name: committee_id
    description: Committee ID (see stg_odata__committee) | מזהה ועדה
  - name: committee_name
    description: Committee name (Hebrew) | שם הוועדה
  - name: ministry_id
    description: Government ministry ID | מזהה משרד ממשלתי
  - name: ministry_name
    description: Government ministry name (Hebrew) | שם המשרד הממשלתי
  - name: government_num
    description: Government number | מספר הממשלה
  - name: duty
    description: Duty description (Hebrew) | תיאור התפקיד
  - name: start_at
    description: Start, Israel local time | מועד התחלה, שעון ישראל
  - name: finish_at
    description: End, Israel local time; null if ongoing | מועד סיום, שעון ישראל; ריק אם עדיין פעיל
  - name: is_current
    description: True if this is current (serving now) | האם בתוקף כעת
  - name: updated_at
    description: When the source row last changed (LastUpdatedDate) | מועד העדכון האחרון של השורה במקור
- name: stg_odata__faction
  description: 'Factions (parliamentary groups) per Knesset. Grain: one row per faction per Knesset | סיעות בכל כנסת'
  columns:
  - name: faction_id
    description: Faction ID | מזהה סיעה
    data_tests:
    - unique
    - not_null
  - name: faction_name
    description: Faction name (Hebrew) | שם הסיעה
  - name: knesset_num
    description: Knesset number (e.g. 25) | מספר הכנסת (למשל 25)
  - name: start_at
    description: Start, Israel local time | מועד התחלה, שעון ישראל
  - name: finish_at
    description: End, Israel local time; null if ongoing | מועד סיום, שעון ישראל; ריק אם עדיין פעיל
  - name: is_current
    description: True if this is current (serving now) | האם בתוקף כעת
  - name: updated_at
    description: When the source row last changed (LastUpdatedDate) | מועד העדכון האחרון של השורה במקור
- name: stg_odata__knesset_period
  description: 'Knesset terms split into assemblies and sittings. Grain: one row per Knesset sitting period | כנסות לפי כנסים ומושבים'
  columns:
  - name: knesset_period_id
    description: Period ID | מזהה תקופה
    data_tests:
    - unique
    - not_null
  - name: knesset_num
    description: Knesset number (e.g. 25) | מספר הכנסת (למשל 25)
  - name: knesset_name
    description: Knesset name (Hebrew) | שם הכנסת
  - name: assembly
    description: Assembly number within the Knesset | מספר הכנס
  - name: plenum
    description: Sitting (winter/summer) number within the assembly | מספר המושב
  - name: start_at
    description: Start, Israel local time | מועד התחלה, שעון ישראל
  - name: finish_at
    description: End, Israel local time; null if ongoing | מועד סיום, שעון ישראל; ריק אם עדיין פעיל
  - name: is_current
    description: True if this is current (serving now) | האם בתוקף כעת
  - name: updated_at
    description: When the source row last changed (LastUpdatedDate) | מועד העדכון האחרון של השורה במקור
- name: stg_odata__ministry
  description: 'Government ministries. Grain: one row per ministry | משרדי ממשלה'
  columns:
  - name: ministry_id
    description: Ministry ID | מזהה משרד
    data_tests:
    - unique
    - not_null
  - name: ministry_name
    description: Ministry name (Hebrew) | שם המשרד
  - name: category_id
    description: Ministry category ID | מזהה קטגוריה
  - name: category_name
    description: Ministry category (Hebrew) | קטגוריה
  - name: gov_id
    description: Government ID in the source | מזהה ממשלה במקור
  - name: is_active
    description: True if the ministry exists today | האם המשרד פעיל
  - name: updated_at
    description: When the source row last changed (LastUpdatedDate) | מועד העדכון האחרון של השורה במקור
- name: stg_odata__committee
  description: 'Knesset committees per Knesset. Grain: one row per committee per Knesset | ועדות הכנסת בכל כנסת'
  columns:
  - name: committee_id
    description: Committee ID | מזהה ועדה
    data_tests:
    - unique
    - not_null
  - name: committee_name
    description: Committee name (Hebrew) | שם הוועדה
  - name: knesset_num
    description: Knesset number (e.g. 25) | מספר הכנסת (למשל 25)
  - name: category_id
    description: Committee category ID (same committee across Knessets) | מזהה קטגוריית ועדה (אותה ועדה לאורך כנסות)
  - name: category_name
    description: Committee category (Hebrew) | קטגוריית הוועדה
  - name: committee_type_id
    description: Committee type ID | מזהה סוג ועדה
  - name: committee_type
    description: 'Committee type: main, sub, joint... (Hebrew) | סוג ועדה: ראשית, משנה, משותפת...'
  - name: additional_type_id
    description: Additional type ID | מזהה סוג נוסף
  - name: additional_type
    description: 'Additional type: permanent, special... (Hebrew) | סוג נוסף: קבועה, מיוחדת...'
  - name: parent_committee_id
    description: Parent committee for subcommittees | ועדת אם (לוועדות משנה)
  - name: parent_committee_name
    description: Parent committee name (Hebrew) | שם ועדת האם
  - name: start_at
    description: Start, Israel local time | מועד התחלה, שעון ישראל
  - name: finish_at
    description: End, Israel local time; null if ongoing | מועד סיום, שעון ישראל; ריק אם עדיין פעיל
  - name: is_current
    description: True if this is current (serving now) | האם בתוקף כעת
  - name: updated_at
    description: When the source row last changed (LastUpdatedDate) | מועד העדכון האחרון של השורה במקור
- name: stg_odata__committee_session
  description: 'Committee sessions (meetings). Grain: one row per committee session | ישיבות ועדה'
  columns:
  - name: committee_session_id
    description: Committee session ID | מזהה ישיבת ועדה
    data_tests:
    - unique
    - not_null
  - name: committee_id
    description: Committee ID (see stg_odata__committee) | מזהה ועדה
  - name: knesset_num
    description: Knesset number (e.g. 25) | מספר הכנסת (למשל 25)
  - name: session_number
    description: Session number within the committee | מספר הישיבה בוועדה
  - name: session_type_id
    description: Session type ID | מזהה סוג ישיבה
  - name: session_type
    description: 'Session type: open / closed (Hebrew) | סוג ישיבה: פתוחה / חסויה'
  - name: status_id
    description: Status ID (see stg_odata__status) | מזהה סטטוס
  - name: status
    description: Session status (Hebrew) | סטטוס הישיבה
  - name: location
    description: Room or place | מקום הישיבה
  - name: session_url
    description: Session page on the Knesset site | קישור לעמוד הישיבה
  - name: broadcast_url
    description: Video broadcast link | קישור לשידור
  - name: note
    description: Free-text note | הערה
  - name: start_at
    description: Start, Israel local time | מועד התחלה, שעון ישראל
  - name: finish_at
    description: End, Israel local time; null if ongoing | מועד סיום, שעון ישראל; ריק אם עדיין פעיל
  - name: updated_at
    description: When the source row last changed (LastUpdatedDate) | מועד העדכון האחרון של השורה במקור
- name: stg_odata__committee_session_item
  description: 'Items on a committee session agenda (bills, queries, topics); all Knessets. Grain: one row per item per committee session | פריטים בסדר היום של ישיבת ועדה; כל הכנסות'
