  - name: publication_series
    description: Publication series (Hebrew) | סדרת פרסום
  - name: first_call_series_id
    description: Publication series of the first reading | סדרת פרסום לקריאה ראשונה
  - name: first_call_series
    description: First reading publication series (Hebrew) | סדרת פרסום לקריאה ראשונה
  - name: magazine_number
    description: Gazette issue number | מספר חוברת
  - name: page_number
    description: Gazette page | מספר עמוד
  - name: summary
    description: Short summary of the law (Hebrew) | תקציר החוק
  - name: updated_at
    description: When the source row last changed (LastUpdatedDate) | מועד העדכון האחרון של השורה במקור
- name: stg_odata__bill_initiator
