  - name: is_discussion
    description: True if the item was discussed (not only listed) | האם הפריט נדון
  - name: updated_at
    description: When the source row last changed (LastUpdatedDate) | מועד העדכון האחרון של השורה במקור
- name: stg_odata__bill
  description: 'Bills (proposed laws). Grain: one row per bill | הצעות חוק'
  columns:
