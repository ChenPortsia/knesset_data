version: 2
sources:
- name: odata
  description: 'Knesset OData v4 tables loaded by ingestion/. Every version of every row is kept (SCD2): _dlt_valid_from / _dlt_valid_to, current version has _dlt_valid_to null | טבלאות OData של הכנסת.
    כל גרסה של כל שורה נשמרת; לגרסה הנוכחית אין _dlt_valid_to'
  database: raw
  schema: bronze
  tables:
  - name: kns_person
    description: 'People: MKs, ministers and other office holders | אנשים: חברי כנסת, שרים ונושאי תפקידים'
  - name: kns_position
    description: Position types (MK, minister, committee chair...) | סוגי תפקידים (ח"כ, שר, יו"ר ועדה...)
  - name: kns_person_to_position
    description: 'Who held which position, when: MK in a faction, minister, committee member | מי כיהן באיזה תפקיד ומתי: ח"כ בסיעה, שר, חבר ועדה'
  - name: kns_faction
    description: Factions (parliamentary groups) per Knesset | סיעות בכל כנסת
  - name: kns_knesset_dates
    description: Knesset terms split into assemblies and sittings | כנסות לפי כנסים ומושבים
  - name: kns_gov_ministry
    description: Government ministries | משרדי ממשלה
  - name: kns_committee
    description: Knesset committees per Knesset | ועדות הכנסת בכל כנסת
  - name: kns_committee_session
    description: Committee sessions (meetings) | ישיבות ועדה
  - name: kns_cmt_session_item
    description: Items on a committee session agenda (bills, queries, topics); all Knessets | פריטים בסדר היום של ישיבת ועדה; כל הכנסות
  - name: kns_plenum_session
    description: Plenum sessions | ישיבות מליאה
  - name: kns_plm_session_item
    description: Items on a plenum session agenda; all Knessets | פריטים בסדר היום של ישיבת מליאה; כל הכנסות
  - name: kns_bill
    description: Bills (proposed laws) | הצעות חוק
  - name: kns_bill_initiator
    description: MKs who initiated or joined a bill; all Knessets | חברי כנסת שיזמו או הצטרפו להצעת חוק; כל הכנסות
  - name: kns_israel_law
    description: Israeli laws in force or repealed; all Knessets | חוקי מדינת ישראל; כל הכנסות
  - name: kns_plenum_vote
    description: Plenum votes (one per vote held) | הצבעות במליאה
  - name: kns_plenum_vote_result
    description: How each MK voted in each plenum vote | איך הצביע כל ח"כ בכל הצבעה במליאה
  - name: kns_query
    description: Parliamentary queries from MKs to ministers | שאילתות של חברי כנסת לשרים
  - name: kns_agenda
    description: Motions for the agenda | הצעות לסדר היום
  - name: kns_status
    description: Status codes for bills, queries, sessions and more | קודי סטטוס להצעות חוק, שאילתות, ישיבות ועוד
  - name: kns_item_type
    description: Types of items discussed in sessions | סוגי פריטים הנדונים בישיבות
  - name: deleted_ids
    description: Rows still in bronze but deleted in the API, found by the weekly check | שורות שנמחקו ב-API, לפי הבדיקה השבועית
