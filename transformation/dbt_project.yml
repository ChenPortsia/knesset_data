name: knesset
version: "1.0.0"
config-version: 2
profile: knesset

# Where dbt looks for each kind of file (the folders `dbt init` creates)
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:  # removed by `dbt clean`
  - "target"
  - "dbt_packages"

# raw.duckdb bronze (from ingestion) -> silver (staging, intermediate) -> gold (mart)
models:
  knesset:
    1_staging:
      +schema: silver
      +materialized: view
    2_intermediate:
      +schema: silver
      +materialized: view
    3_mart:
      +schema: gold
      +materialized: table

seeds:
  knesset:
    +schema: silver

vars:
  from_knesset: 20  # first Knesset in scope; keep in step with ingestion/.dlt/config.toml
