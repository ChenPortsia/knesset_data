# dbt reads the raw database (written only by ingestion) read-only, as `raw`,
# and writes silver and gold to its own warehouse file.
knesset:
  target: dev
  outputs:
    dev:     # the full load
      type: duckdb
      path: ../data/warehouse/warehouse.duckdb
      threads: 4
      attach:
        - {path: ../data/raw/raw.duckdb, alias: raw, read_only: true}
    sample:  # the test load from `make sample`
      type: duckdb
      path: ../data/warehouse/warehouse_sample.duckdb
      threads: 4
      attach:
        - {path: ../data/raw/raw_sample.duckdb, alias: raw, read_only: true}
