# yaml-language-server: $schema=../schemas/glossary.json
# Knesset committees.

- id: glossary.committee
  term_he: ועדה
  term_en: Knesset committee
  synonyms: [ועדת הכנסת, committee]
  definition: >
    Where bills are prepared and the government is overseen. Each Knesset has new committee
    ids; dim_committee.category_id is the same committee across Knessets.
  maps_to:
    - column: dim_committee.committee_id
    - column: dim_committee.category_id

- id: glossary.main_committee
  term_he: ועדה ראשית
  term_en: main (standing) committee
  synonyms: [ועדה קבועה, standing committee]
  definition: One of the permanent committees set by the Knesset's rules, such as Finance or Foreign Affairs and Defense; as opposed to subcommittees, joint and special committees.
  maps_to:
    - column: dim_committee.committee_type
      value: ועדה ראשית

- id: glossary.subcommittee
  term_he: ועדת משנה
  term_en: subcommittee
  definition: A smaller committee under a main committee, with parent_committee_id pointing to it.
  maps_to:
    - column: dim_committee.committee_type
      value: ועדת משנה
    - column: dim_committee.parent_committee_id

- id: glossary.committee_chair
  term_he: יו"ר ועדה
  term_en: committee chair
  synonyms: [יושב ראש ועדה, chairman]
  definition: The MK who runs a committee's sessions and agenda.
  maps_to:
    - column: fct_person_role.role
      value: committee_chair

- id: glossary.closed_session
  term_he: ישיבה חסויה
  term_en: closed (classified) session
  synonyms: [חסויה, ישיבה סגורה, classified]
  definition: A committee session not open to the public, mostly on security. About 2% of sessions.
  maps_to:
    - column: fct_committee_session.session_type
      value: חסויה

- id: glossary.joint_committee
  term_he: ועדה משותפת
  term_en: joint committee
  definition: A committee made of members of two or more main committees, set up for a bill or subject that belongs to both.
  maps_to:
    - column: dim_committee.committee_type
      value: ועדה משותפת

- id: glossary.special_committee
  term_he: ועדה מיוחדת
  term_en: special committee
  synonyms: [ועדה זמנית, ועדת חקירה פרלמנטרית, temporary committee]
  definition: >
    A committee set up for one subject or for one Knesset's term, not one of the permanent
    committees. Its category_id is often empty, so it can't be followed across Knessets.
  maps_to:
    - column: dim_committee.committee_type
      value: ועדה מיוחדת

- id: glossary.committee_member
  term_he: חבר ועדה
  term_en: committee member
  synonyms: [חברי הוועדה, חברים בוועדה, מי חבר בוועדה, ממלא מקום, חבר בוועדה, substitute member]
  definition: >
    An MK appointed to a committee, as a full member or a substitute (ממלא מקום). Membership
    is an appointment; it does not show who attended a session.
  maps_to:
    - column: fct_person_role.role
      value: committee_member
    - column: fct_person_role.role
      value: committee_substitute
  see_also: [glossary.committee_chair]

- id: glossary.committee_session
  term_he: ישיבת ועדה
  term_en: committee session (meeting)
  synonyms: [דיון בוועדה, ישיבה, דיון, ישיבה מבוטלת, committee meeting, hearing]
  definition: >
    One meeting of a committee. Cancelled sessions stay in the data with status מבוטלת:
    leave them out when counting sessions held.
  maps_to:
    - column: fct_committee_session.committee_session_id
    - column: fct_committee_session.status
      value: מבוטלת
  see_also: [metric.committee_sessions, glossary.closed_session]

- id: glossary.protocol
  term_he: פרוטוקול
  term_en: committee protocol (minutes)
  synonyms: [פרוטוקול הישיבה, דברי הכנסת, מה נאמר, מי אמר, דיון, דברים בוועדה, minutes, transcript, what was said]
  definition: >
    The written record of a committee session: who spoke and what they said, turn by turn.
    Edited minutes, not a word-for-word transcript.
  maps_to:
    - column: fct_turn.turn_text
    - column: fct_turn.speaker_name
  see_also: [rule.protocols_are_partial_minutes]
