[project]
name = "knesset-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dlt[duckdb]",
    "dbt-duckdb",
]

[dependency-groups]
dev = ["pytest", "ruff"]
notebook = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "nbconvert>=7.17.2",
    "pandas>=3.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "E501"]  # imports after sys.path setup; long SQL lines
